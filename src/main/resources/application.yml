spring:
  application:
    name: swe-agent
  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile
    mcp:
      client:
        enabled: true
        type: sync
        sse:
          connections:
            tools:
              url: http://localhost:8081
        streamable-http:
          connections:
            tools:
              url: http://localhost:8081
server:
  port: 8080
